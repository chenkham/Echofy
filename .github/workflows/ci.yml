name: CI Build & Verify

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Verify APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n8933bad161af65ca73a1442ab0f63773ab4fe4b\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b68b9e3491602d004fe197b12b9614" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b816f454d0e" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK (Fallback Test IDs)
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
